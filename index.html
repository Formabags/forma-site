<style>
:root{--g:#00482B;--g2:#2F6B4F;--g3:#7FB397;--mint:#E3EFE8;--sub:#a9cdb9;--ink:#16211B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--g);color:#fff;font-family:Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;isolation:isolate}

/* background: oversized ghost symbols + fine grid + vignette */
.bg{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg::before{content:"";position:absolute;inset:0;background:
  linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/64px 64px,
  linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 20%,transparent 75%)}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 45%,transparent 40%,rgba(0,20,10,.45) 100%)}
.ghost{position:absolute;width:min(78vw,1100px);fill:#fff;opacity:.045}
.ghost.l{left:-30vw;bottom:-18vh;transform:rotate(-8deg)}
.ghost.r{right:-30vw;top:-22vh;transform:rotate(172deg)}

header,footer{display:flex;align-items:center;justify-content:space-between;padding:28px clamp(20px,5vw,64px);gap:16px}
header .badge{width:56px;height:56px;background:var(--g);border:1px solid rgba(255,255,255,.22);box-shadow:0 3px 6px rgba(0,0,0,.30),0 12px 26px rgba(0,0,0,.38)}
header .sym{width:100%;height:100%;fill:#fff;display:block}
.tag{font-family:Poppins,sans-serif;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--sub);font-weight:500}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px clamp(20px,5vw,64px) 40px}
.mark{width:clamp(84px,11vw,132px);margin-bottom:clamp(28px,5vh,52px);overflow:visible}
.mark path{fill:#fff}
.wm{width:min(78vw,760px);height:auto;display:block;fill:#fff}
.rule{width:56px;height:2px;background:var(--g3);margin:clamp(28px,5vh,48px) auto clamp(20px,3vh,28px);transform-origin:center}
.soon{font-family:Poppins,sans-serif;font-weight:500;font-size:clamp(12px,1.2vw,14px);letter-spacing:.42em;text-transform:uppercase;color:var(--sub);padding-left:.42em}
.line{margin-top:18px;font-family:Poppins,sans-serif;font-weight:400;font-size:clamp(18px,2.1vw,24px);color:#fff;letter-spacing:.01em}

footer{border-top:1px solid rgba(255,255,255,.12);margin:0 clamp(20px,5vw,64px);padding-left:0;padding-right:0;flex-wrap:wrap;font-size:13px;color:#cfe3d7}
footer a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(127,179,151,.6);padding-bottom:1px}
footer a:hover{border-color:#fff}
footer .k{font-family:Poppins,sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--g3);margin-right:10px;font-weight:500}
footer .legal{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;font-size:11px;line-height:1.5;color:#8fb8a1;letter-spacing:.03em}
footer .legal i{width:3px;height:3px;border-radius:50%;background:var(--g3);opacity:.8}
@media (max-width:640px){footer .legal{flex-direction:column;align-items:flex-start;gap:2px}footer .legal i{display:none}}

/* entrance: the three strokes of the symbol assemble, then the wordmark rises */
@media (prefers-reduced-motion:no-preference){
  .wm{animation:rise 1.2s cubic-bezier(.2,.8,.2,1) .2s both}
  .rule{animation:grow .9s cubic-bezier(.2,.8,.2,1) .8s both}
  .soon,.line{animation:fade 1s ease 1s both}
  .line{animation-delay:1.2s}
  header,footer{animation:fade 1.2s ease 1.4s both}
  .ghost.l{animation:drift 26s ease-in-out infinite alternate}
  .ghost.r{animation:drift2 30s ease-in-out infinite alternate}
}
@keyframes drop{from{opacity:0;transform:translateY(-90px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translate(-90px,60px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translate(90px,60px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drift{to{transform:rotate(-4deg) translate(3vw,-2vh)}}
@keyframes drift2{to{transform:rotate(176deg) translate(3vw,-2vh)}}

@media (max-width:640px){
  footer{flex-direction:column;align-items:flex-start;gap:10px;padding:22px 0}
  .ghost{width:120vw}.ghost.l{left:-60vw}.ghost.r{right:-60vw}
}
</style>
